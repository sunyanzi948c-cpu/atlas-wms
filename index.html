<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS WMS 倉儲管理系統 - 雲端版</title>
    <style>
        :root { --primary-color: #2c3e50; --secondary-color: #e74c3c; --bg-color: #f4f7f6; --sidebar-width: 250px; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: var(--sidebar-width); background-color: var(--primary-color); color: white; display: flex; flex-direction: column; }
        .sidebar h2 { text-align: center; padding: 20px 0; margin: 0; background-color: #1a252f; color: var(--secondary-color); font-weight: 900; letter-spacing: 2px; }
        .menu-item { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid #34495e; transition: 0.3s; }
        .menu-item:hover, .menu-item.active { background-color: var(--secondary-color); }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .topbar { background: #fff; padding: 15px 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .role-selector select { padding: 8px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }
        .workspace { padding: 30px; overflow-y: auto; flex: 1; }
        
        .scan-panel { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 5px solid var(--secondary-color); transition: 0.3s; }
        .scan-input { width: 100%; padding: 15px; font-size: 24px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; margin-top: 10px; transition: 0.3s; }
        .scan-input:focus { outline: none; border-color: var(--secondary-color); }
        
        .scan-panel.mode-outbound { border-left-color: #3498db; }
        .scan-panel.mode-outbound .scan-input:focus { border-color: #3498db; }
        .scan-panel.mode-inventory { border-left-color: #8e44ad; }
        .scan-panel.mode-inventory .scan-input:focus { border-color: #8e44ad; }
        .scan-panel.mode-quality { border-left-color: #16a085; }
        .scan-panel.mode-quality .scan-input:focus { border-color: #16a085; }
        
        /* 狀態顏色：鎖定訂單(藍底), 鎖定商品等待儲位(黃底) */
        .scan-input.state-item { border-color: #3498db !important; background-color: #ebf5fb; }
        .scan-input.state-bin { border-color: #f39c12 !important; background-color: #fdfae6; }
        
        .info-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #ecf0f1; padding: 15px; border-radius: 6px; text-align: center; }
        .card-title { font-size: 12px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; }
        .card-value { font-size: 18px; color: var(--primary-color); margin-top: 5px; font-weight: bold; }
        table { width: 100%; background: #fff; border-collapse: collapse; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #333; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        
        .bg-green { background: #d4edda; color: #155724; }
        .bg-yellow { background: #fff3cd; color: #856404; }
        .bg-red { background: #f8d7da; color: #721c24; }
        .bg-blue { background: #cce5ff; color: #004085; }
        .bg-purple { background: #e8daef; color: #6c3483; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>ATLAS WMS</h2>
        <div class="menu-item active" id="menu-inbound">📥 Inbound (收貨 / 上架)</div>
        <div class="menu-item" id="menu-outbound">📤 Outbound (揀貨 / 出貨)</div>
        <div class="menu-item" id="menu-inventory">🏢 Inventory (庫存 / 儲位)</div>
        <div class="menu-item" id="menu-quality">🔍 Quality (品質檢驗)</div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h3 id="header-title" style="margin:0; color: #2c3e50;">📥 Inbound: Receiving & Put Away</h3>
            <div class="role-selector">
                <label>模擬登入權限：</label>
                <select id="roleSelect">
                    <option value="warehouse">倉管人員 (Warehouse)</option>
                    <option value="qa">品保人員 (QA)</option>
                </select>
            </div>
        </div>

        <div class="workspace">
            <div class="scan-panel" id="scanner-area">
                <label id="scan-label" style="font-weight: bold; color: #333;">第一步：請掃描採購單號 (Which PO?)</label>
                <input type="text" id="barcodeInput" class="scan-input" placeholder="請掃描 PO 條碼..." autocomplete="off">
                
                <div class="info-cards">
                    <div class="card"><div class="card-title">What Item? (應收料號)</div><div class="card-value" id="val-item">--</div></div>
                    <div class="card"><div class="card-title">Progress (收貨進度)</div><div class="card-value" id="val-qty">--</div></div>
                    <div class="card"><div class="card-title" id="title-lot-or-order">Which PO? (單號)</div><div class="card-value" id="val-lot-or-order">--</div></div>
                    <div class="card"><div class="card-title" id="title-bin-or-to">Where is it? (儲位指示)</div><div class="card-value" id="val-bin-or-to">--</div></div>
                </div>
            </div>

            <h4 style="color: #7f8c8d;">雲端作業紀錄 (即時寫入 Firestore)</h4>
            <table>
                <thead><tr><th>時間</th><th>動作</th><th>單據與明細</th><th>狀態</th></tr></thead>
                <tbody id="transaction-log"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDsHhR_etZaAXVQpyzMDm1IVN7j1ZMWyH0",
            authDomain: "atlas-wms.firebaseapp.com",
            projectId: "atlas-wms",
            storageBucket: "atlas-wms.firebasestorage.app",
            messagingSenderId: "686564888137",
            appId: "1:686564888137:web:ace7d02ccab06137c2b998"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const input = document.getElementById('barcodeInput');
        const scanLabel = document.getElementById('scan-label');
        const logTable = document.getElementById('transaction-log');
        
        let sysMode = 'INBOUND'; 
        
        // Inbound 專用狀態追蹤
        let currentScanState = 'ORDER'; // 初始狀態改為 ORDER
        let activeOrder = '';
        let expectedItem = '';
        let expectedQty = 0;
        let receivedQty = 0;
        let pendingItemDesc = '';
        let pendingTempRow = null;

        function resetUI() {
            document.querySelectorAll('.card-value').forEach(el => el.innerText = '--');
            input.value = '';
            input.classList.remove('state-item', 'state-bin');
            
            if (sysMode === 'INBOUND') {
                currentScanState = 'ORDER';
                scanLabel.innerText = "第一步：請掃描採購單號 (Which PO?)";
                input.placeholder = "請掃描 PO 條碼...";
            } else {
                currentScanState = 'ITEM';
            }
            input.focus();
        }

        function switchMode(mode) {
            sysMode = mode;
            resetUI();
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            // (省略樣式切換，與上版相同，專注處理 Inbound 邏輯)
            if (mode === 'INBOUND') {
                document.getElementById('menu-inbound').classList.add('active');
            } else if (mode === 'OUTBOUND') {
                document.getElementById('menu-outbound').classList.add('active');
            } else if (mode === 'INVENTORY') {
                document.getElementById('menu-inventory').classList.add('active');
            } else if (mode === 'QUALITY') {
                document.getElementById('menu-quality').classList.add('active');
            }
        }

        document.getElementById('menu-inbound').addEventListener('click', () => switchMode('INBOUND'));
        document.getElementById('menu-outbound').addEventListener('click', () => switchMode('OUTBOUND'));
        document.getElementById('menu-inventory').addEventListener('click', () => switchMode('INVENTORY'));
        document.getElementById('menu-quality').addEventListener('click', () => switchMode('QUALITY'));

        input.addEventListener('keypress', async function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const barcode = e.target.value.trim();
                if (barcode === "") return;

                const timeStr = new Date().getHours().toString().padStart(2, '0') + ':' + new Date().getMinutes().toString().padStart(2, '0');

                // ==========================================
                // 升級版 Inbound：三段式掃描 (訂單防呆)
                // ==========================================
                if (sysMode === 'INBOUND') {
                    
                    // 階段 1：掃描單據 (ORDER)
                    if (currentScanState === 'ORDER') {
                        const orderSnap = await getDoc(doc(db, "Orders", barcode));
                        if (orderSnap.exists()) {
                            const orderData = orderSnap.data();
                            activeOrder = barcode;
                            expectedItem = orderData.item_code;
                            expectedQty = orderData.expected_qty;
                            receivedQty = orderData.received_qty || 0;

                            if (receivedQty >= expectedQty) {
                                alert(`✅ 此訂單 ${barcode} 已經全數收貨完成！`);
                                input.value = ''; return;
                            }

                            document.getElementById('val-lot-or-order').innerText = activeOrder;
                            document.getElementById('val-item').innerText = `需收料: ${expectedItem}`;
                            document.getElementById('val-qty').innerText = `${receivedQty} / ${expectedQty} (已收/應收)`;

                            currentScanState = 'ITEM';
                            input.classList.add('state-item');
                            scanLabel.innerText = "第二步：請掃描商品條碼 (核對訂單)";
                            input.placeholder = `已鎖定單據 ${activeOrder}。請掃描商品...`;
                        } else {
                            alert("❌ 查無此採購單號，請確認後再掃描。");
                        }
                    } 
                    
                    // 階段 2：掃描商品 (ITEM) 進行核對
                    else if (currentScanState === 'ITEM') {
                        // 防呆 A：核對料號是否符合單據
                        if (barcode !== expectedItem) {
                            alert(`🚨 收貨錯誤！\n這張單要求收的料號是 ${expectedItem}\n你掃描的是 ${barcode}，請退回異常品！`);
                            input.value = ''; return;
                        }

                        // 料號正確，去 Items 主檔抓規格與建議儲位
                        const itemSnap = await getDoc(doc(db, "Items", barcode));
                        if(itemSnap.exists()) {
                            pendingItemDesc = itemSnap.data().description || barcode;
                            document.getElementById('val-item').innerText = pendingItemDesc;
                            document.getElementById('val-bin-or-to').innerText = `建議: ${itemSnap.data().default_bin || '--'}`;
                            
                            currentScanState = 'BIN';
                            input.classList.remove('state-item');
                            input.classList.add('state-bin');
                            scanLabel.innerText = "第三步：請掃描實際存放的「儲位條碼」(完成上架)";
                            input.placeholder = `已核對商品：${pendingItemDesc}。請掃描儲位...`;
                        }
                    } 
                    
                    // 階段 3：掃描儲位 (BIN) 完成入庫
                    else if (currentScanState === 'BIN') {
                        // 防呆 B：確認是不是掃到商品條碼
                        if (/^\d{12,}$/.test(barcode)) { 
                            alert("🚫 防呆攔截：請掃描正確的儲位標籤。"); 
                            input.value = ''; return; 
                        }

                        try {
                            // 1. 寫入收貨紀錄
                            await addDoc(collection(db, "ScanLogs"), { 
                                action: "Receive_And_PutAway", 
                                order_no: activeOrder,
                                scanned_item: expectedItem, 
                                actual_bin: barcode, 
                                timestamp: serverTimestamp() 
                            });
                            
                            // 2. 更新商品主檔最新位置
                            await updateDoc(doc(db, "Items", expectedItem), { default_bin: barcode });

                            // 3. 更新訂單進度 (已收數量 + 1)
                            receivedQty += 1;
                            await updateDoc(doc(db, "Orders", activeOrder), { received_qty: receivedQty });

                            // 畫面顯示成功
                            const tr = document.createElement('tr');
                            tr.innerHTML = `<td>${timeStr}</td><td><strong>Put Away</strong></td><td>單號: ${activeOrder} <br><small style="color:#27ae60;">${expectedItem} 📍已上架至 ${barcode}</small></td><td><span class="status-badge bg-green">收貨成功 (${receivedQty}/${expectedQty})</span></td>`;
                            logTable.insertBefore(tr, logTable.firstChild);

                            // 判斷訂單是否結束
                            if (receivedQty >= expectedQty) {
                                alert(`🎉 恭喜！採購單 ${activeOrder} 已全數收貨上架完畢。`);
                                resetUI();
                            } else {
                                // 單據還沒收完，退回「第二步：掃描商品」繼續收下一箱
                                currentScanState = 'ITEM';
                                input.classList.remove('state-bin');
                                input.classList.add('state-item');
                                document.getElementById('val-qty').innerText = `${receivedQty} / ${expectedQty} (已收/應收)`;
                                document.getElementById('val-bin-or-to').innerText = '--';
                                scanLabel.innerText = "第二步：請繼續掃描下一箱商品條碼";
                                input.placeholder = `繼續收貨 (進度 ${receivedQty}/${expectedQty})...`;
                            }
                        } catch (error) {
                            console.error(error);
                            alert("寫入資料庫失敗。");
                        }
                    }
                } 
                
                // (其餘模組邏輯先隱藏省略，保留上一版的運作方式)
                e.target.value = '';
            }
        });
        resetUI();
    </script>
</body>
</html>
